name: validate
on: [push, pull_request]
defaults:
  run:
    working-directory: mlops
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m evals.run > eval-report.json
      - run: python -m evals.ardc_run > ardc-report.json
      - run: pip-audit
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            mlops/eval-report.json
            mlops/ardc-report.json
      - run: docker build -t c4l:test .
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
